services:
  web:
    build: .
    init: true
    ports:
      - "${TTRS_BIND:-0.0.0.0}:${TTRS_PORT:-1558}:1558"
    environment:
      DATABASE_URL: postgresql://ttrs:${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}@db:5432/ttrs
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ttrs
      POSTGRES_DB: ttrs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttrs -d ttrs"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    # No published database port: only web can reach db through Compose's network.
volumes:
  postgres-data:
