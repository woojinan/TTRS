<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172554" />
    <title>테트리스 배틀</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="lobby" aria-labelledby="page-title">
      <section class="lobby-card">
        <p class="eyebrow">REAL-TIME TETRIS</p>
        <h1 id="page-title">테트리스 배틀</h1>
        <p class="subtitle">간단하게 즐기는 실시간 대전</p>

        <form id="lobby-form" novalidate>
          <label for="nickname">닉네임</label>
          <input
            id="nickname"
            name="nickname"
            type="text"
            maxlength="12"
            autocomplete="nickname"
            placeholder="닉네임을 입력하세요"
            aria-describedby="message"
          />
          <p id="message" class="message" role="status" aria-live="polite"></p>

          <div class="actions">
            <button type="button" data-action="quick-match">바로 대전하기</button>
            <button type="button" data-action="create-room" class="secondary">방 만들기</button>
            <button type="button" data-action="join-room" class="secondary">방 참가하기</button>
          </div>
        </form>

        <button type="button" data-action="how-to" class="text-button">게임 방법</button>
      </section>
    </main>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
